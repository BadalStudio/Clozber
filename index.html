
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Project</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #10131a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #7c9cff;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 14px;
      margin: 16px 0;
    }

    button {
      padding: 13px 18px;
      margin: 5px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
    }

    #startBtn {
      background: #7c9cff;
      color: #10131a;
    }

    #stopBtn {
      background: #ff6b6b;
      color: #ffffff;
    }

    #status {
      color: #b9c4d8;
      overflow-wrap: anywhere;
    }

    .note {
      color: #aab3c5;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>Live Camera</h1>
    <p>Step 1: Test your camera</p>

    <video id="video" autoplay playsinline muted></video>

    <p id="status">Camera is stopped.</p>

    <button id="startBtn">Start Camera</button>
    <button id="stopBtn">Stop Camera</button>

    <p class="note">
      Camera access requires your permission.
      This demo previews video on this device only.
      It does not send video to another phone.
    </p>
  </main>

  <script>
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let stream = null;

    startBtn.addEventListener("click", async () => {
      if (stream) return;

      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent =
          "Camera unavailable. Open this page over HTTPS.";
        return;
      }

      try {
        status.textContent = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = "Camera is ON — local preview only.";
      } catch (error) {
        stream?.getTracks().forEach(track => track.stop());
        stream = null;
        status.textContent =
          "Camera could not start: " + error.message;
      }
    });

    stopBtn.addEventListener("click", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      status.textContent = "Camera is stopped.";
    });

    window.addEventListener("pagehide", () => {
      stream?.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
  </html>
